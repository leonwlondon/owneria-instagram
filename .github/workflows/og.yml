name: Imágenes OG del blog
on:
  schedule:
    - cron: "20 13 * * *" # 7:20 CDMX: el blog publica a las 7:00
    - cron: "0 15 * * *" # 9:00 CDMX: segunda pasada por si el blog se tardó
  workflow_dispatch:
concurrency:
  group: instagram
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun src/og.ts
      - name: Subir imágenes nuevas
        run: |
          git config user.name "owneria-bot"
          git config user.email "owneria-bot@users.noreply.github.com"
          git add og
          git diff --cached --quiet && exit 0
          git commit -m "OG: imágenes nuevas del blog"
          git pull --rebase
          git push
