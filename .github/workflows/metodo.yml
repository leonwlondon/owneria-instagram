name: Serie Método OWNER
# Publica las 6 piezas del Método OWNER en orden (portada, R, E, N, W, O), una por minuto.
# Solo a mano («Run workflow»). Volver a correrla es seguro: lo publicado queda en metodo-publicado.json.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: instagram
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun src/metodo.ts publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - if: always()
        run: |
          git config user.name "owneria-bot"
          git config user.email "owneria-bot@users.noreply.github.com"
          if [ -f metodo-publicado.json ]; then
            git add metodo-publicado.json
            git commit -q -m "Publicado en Instagram: serie Método OWNER" || true
            git pull -q --rebase && git push -q
          fi
