name: Serie de arranque (15 posts)
# Publica los 15 posts de src/arranque.ts en orden, uno por minuto. Solo a mano («Run workflow»).
# Volver a correrla es seguro: lo publicado queda en arranque-publicado.json.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: instagram
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun src/arranque.ts publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - if: always()
        run: |
          git config user.name "owneria-bot"
          git config user.email "owneria-bot@users.noreply.github.com"
          git add arranque-publicado.json publicados.json 2>/dev/null || true
          git commit -q -m "Publicado en Instagram: serie de arranque" || true
          git pull -q --rebase && git push -q
