name: Instagram diario
on:
  schedule:
    - cron: "30 14 * * *" # 8:30 CDMX: artículo del blog (sale a las 7:00)
    - cron: "0 1 * * *" # 19:00 CDMX: pieza propia (casos, glosario, ideas, preguntas…)
  workflow_dispatch:
    inputs:
      turno:
        description: "Turno"
        type: choice
        options: [manana, tarde]
        default: manana
      prueba:
        description: "Solo dibujar, sin publicar"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: instagram
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          git config user.name "owneria-bot"
          git config user.email "owneria-bot@users.noreply.github.com"
      - run: bun src/diario.ts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TURNO: ${{ github.event.schedule == '0 1 * * *' && 'tarde' || inputs.turno || 'manana' }}
          PRUEBA: ${{ inputs.prueba && '1' || '0' }}
